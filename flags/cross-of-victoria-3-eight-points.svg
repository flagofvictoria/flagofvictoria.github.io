<title id="t">The Cross of Victoria - eight-pointed stars</title>
<desc id="d">A proposed flag for the State of Victoria. Proportion 1:2. A blue cross fimbriated white on a red field. Blue arm 17.3% of the height; white fimbriation 30% of the arm width each side. Colours: crimson #CA003C, blue #003C71 (Pantone 541 C, the state colour of Victoria), white #FFFFFF. Charged with five white eight-pointed stars, as on the Australian Federation Flag of 1831, inner radius 1/2 of the circumradius, one at the crossing and one on each arm, each outer star centred 18% of the height in from its nearest edge. Every star is 87.2% of the arm width point to point.</desc>
