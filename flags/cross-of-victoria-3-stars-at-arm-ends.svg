<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" width="1200" height="600" role="img" aria-labelledby="t d">
<title id="t">The Cross of Victoria - stars near the arm ends</title>
<desc id="d">A proposed flag for the State of Victoria. Proportion 1:2. A blue cross fimbriated white on a red field. Blue arm 17.3% of the height; white fimbriation 30% of the arm width each side. Colours: red #C40A47, blue #184491, white #FFFFFF. Charged with five white five-pointed stars, one at the crossing and one on each arm, each outer star centred 18% of the height in from its nearest edge.</desc>
