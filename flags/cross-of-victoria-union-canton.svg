<title id="t">The Cross of Victoria - with the Union Jack</title>
<desc id="d">A proposed flag for the State of Victoria. Proportion 1:2. A blue cross fimbriated white on a red field. Blue arm 17.3% of the height; white fimbriation 30% of the arm width each side. The Union Jack fills the canton at 1:2, to the white edging, and the vertical arm is set toward the hoist, centred 43.1% of the length from it. Colours: the flag's own three and no others, the Union Jack included: crimson #CA003C, blue #003C71 (Pantone 541 C, the state colour of Victoria) and white #FFFFFF. Charged with five white eight-pointed stars, as on the Australian Federation Flag of 1831, inner radius 1/2 of the circumradius, one at the crossing and one on each arm, each outer star centred 18% of the height in from its nearest edge.</desc>
