<text x="880.0" y="116.0" font-size="25" text-anchor="middle">Construction sheet. Proportion 1 : 2, height to width. Seven points, at two fifths of the length.</text>
<text x="880.0" y="150.0" font-size="22" text-anchor="middle">Every dimension is given as a ratio of the hoist, A.</text>
