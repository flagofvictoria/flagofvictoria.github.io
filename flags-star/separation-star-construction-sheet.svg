<title id="t">The Star of Victoria: construction sheet</title>
<desc id="d">A dimensioned construction drawing of the proposed flag of Victoria at 1:2, a white seven-pointed star on a crimson ground set at two fifths of the length, with a table of standard proportions and the colour specification.</desc>
<rect width="1760" height="2120" fill="#fff"/>
<g fill="#000" stroke="none" font-family="Helvetica, Arial, 'Liberation Sans', sans-serif" font-size="25" text-anchor="middle">
