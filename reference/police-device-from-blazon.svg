<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="600" height="600" role="img" aria-labelledby="t d">
<title id="t">The device at the centre of the Victoria Police badge, drawn from the published blazon</title>
<desc id="d">A diagram, not a reproduction of the badge artwork. A roundel: a blue cross fimbriated white on red, charged with five white five-pointed stars, one at the crossing and one on each arm. Drawn from the blazon recorded by Flags of the World, in this proposal's own colours.</desc>
