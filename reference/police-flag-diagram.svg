<title id="t">Victoria Police flag, diagram</title>
<desc id="d">A diagram, not the force's artwork: a British Blue Ensign with, in the fly, the device at the centre of the Victoria Police badge, a blue cross edged white on red with five white five-pointed stars. The crest around it (star, crown, title band and motto) is not drawn.</desc>
